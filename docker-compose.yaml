services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    ports:
      - "8080:80"

    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src
      - ./utils:/var/www/utils

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cards
      DB_USERNAME: cards
      DB_PASSWORD: cards

  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: cards
      MYSQL_USER: cards
      MYSQL_PASSWORD: cards
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: